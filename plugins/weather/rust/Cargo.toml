[package]
name = "supernotch-weather"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "SuperNotch weather backend: forecast, geocoding, state, and locally rendered ECMWF IFS maps"

[[bin]]
name = "supernotch-weather"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25"
fs2 = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
